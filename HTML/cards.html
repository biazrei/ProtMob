<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/card-horizontal.css">

</head>
<body>
<h1>Card 1</h1>
<a href="#" class="card">
    <img class="card__image" src="../docs/image.png" alt="Imagem">

    <div class="card__content">
        <p class="card__date">12/08/2026</p>
        <h3 class="card__title">Título da postagem</h3>
    </div>
</a>

 <h1>Card 2</h1>
<a href="#" class="card">
    <img class="card__image" src="../docs/image.png" alt="Imagem">

    <div class="card__content">
        <h3 class="card__title">Título da postagem</h3>
    </div>
</a>   

<h1>Card Horizontal 1 </h1>
   <article class="card--horizontal">
        <div class="card__image-placeholder"></div>

        <div>
            <h3>Título da publicação</h3>
            <p class="card-horizontal__subtitle">Descrição da publicação...</p>
        </div>
    </article>
<h1>Card Horizontal 2 </h1>
    <article class="card--horizontal">
        <div class="card__image-placeholder"></div>

        <div>
             <p class="card-horizontal__subtitle">Descrição da publicação...</p>
            <h3 >Outra publicação</h3>
            
        </div>
    </article>

    <h2>Card Destaque</h2>
<a href="#" class="card-destaque">

    <img class="card-destaque__image" src="../docs/image.png" alt="Imagem da postagem">
     <div class="card-destaque__content">
       <p class="card-destaque__date">12/08/2026</p>

        <h3 class="card-destaque__title">
            Título da postagem
        </h3>

    </div>
