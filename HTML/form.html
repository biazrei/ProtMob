<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="../css/variables.css">
     <link rel="stylesheet" href="../css/buttons.css">
     <link rel="stylesheet" href="../css/input.css">
     <link rel="stylesheet" href="../css/form.css">
  
</head>
<body>


    <form class="form">
     <h3>Tipo 1</h3>
    <input class="input" type="email" placeholder="Digite seu email"> 
    <input class="input" type="password" placeholder="Digite sua senha">
    
    <label class="checkbox">
    <input type="checkbox">
    Concordo em receber novidades por email
</label> 
   
<button class="button button--primary" type="submit">Confirmar</button>
</form>


<form class="form">
    <h3>Tipo 2</h3>
    <input class="input" type="text" placeholder="Título">

    <textarea class="input" placeholder="Texto da postagem"></textarea>

   <div class="form__row">
    <input class="input" type="text" placeholder="Categorias">
    <input class="input" type="text" placeholder="Tags">
</div>

    <div>
        <button class="button button--secondary">Salvar rascunho</button>
        <button class="button button--secondary">Enviar para revisão</button>
        <button class="button button--primary">Publicar</button>
    </div>

</form>

</body>
</html>
